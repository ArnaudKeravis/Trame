<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Romain · Direct du Château × Trame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;600&display=swap" />
  <style>
    :root{--ink:#131012;--bone:#ECE7DD;--ultra:#2C2BE8;--grey:#86837C;--hair:#D4CEC1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bone);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding:7vh 7vw}
    .kicker{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ultra)}
    h1{font-family:"Archivo Black",Arial Black,sans-serif;font-size:clamp(32px,5vw,52px);line-height:.94;max-width:14ch;margin:16px 0 28px}
    .links{display:flex;flex-direction:column;gap:0;max-width:520px}
    a{display:block;padding:18px 0;border-top:1px solid var(--hair);color:var(--ink);text-decoration:none}
    a:hover{color:var(--ultra)}
    a strong{font-family:"Space Grotesk",system-ui,sans-serif;font-size:15px;letter-spacing:.04em}
    a span{display:block;color:var(--grey);font-size:14px;margin-top:4px}
    .note{margin-top:36px;color:var(--grey);font-size:13px;max-width:48ch}
  </style>
</head>
<body>
  <p class="kicker">Direct du Château × Trame · 4 décembre 2026</p>
  <h1>Session Romain</h1>
  <div class="links">
    <a href="/romain/deck"><strong>Présentation</strong><span>Deck 30 min — ce qu’on a compris, ce qu’on teste</span></a>
    <a href="/romain/commande"><strong>Plateforme</strong><span>Prototype prise de commande (assistant prépare, Romain décide)</span></a>
  </div>
  <p class="note">Usage interne Trame / session client. Ne pas indexer.</p>
</body>
</html>
