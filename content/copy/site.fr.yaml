  headline: Nous ne vendons pas de l'IA. Nous vendons ses effets.
  not:
    - Des agents
    - Des prompts
    - De l'automatisation
    - De la tech à intégrer
  but:
    - Du temps gagné
    - Une charge cognitive réduite
    - Une meilleure capacité d'exécution
    - Une adoption réussie

workflows:
  headline: Les workflows cognitifs
  items:
    - Recherche & veille
    - Analyse & synthèse
    - Recommandations
    - Préparation de décisions
    - Coordination & livrables
    - Création de connaissances

pains:
  headline: Des douleurs concrètes, chiffrées
  items:
    - workflow: Appels d'offres
      before: 3 jours par pitch
      after: une demi-journée
    - workflow: Reporting campagnes
      before: 2 jours/mois
      after: 2 heures
    - workflow: Verbatims clients
      before: des semaines
      after: un jour
    - workflow: Veille concurrence
      before: éparpillée
      after: synthèse hebdo

method:
  headline: Du travail réel à la preuve
