      price: 3–6 k€
    - name: Workflow Transformation Sprint
      duration: 2–3 semaines
      price: 12–20 k€
      highlight: true
    - name: Operating Partner
      duration: abonnement
      price: 3–6 k€/mois
    - name: Accélérateurs
      duration: produit
      price: licence

